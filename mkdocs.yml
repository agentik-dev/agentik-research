site_name: Long-running Claude Code
site_url: https://agentik-dev.github.io/agentik-research/
site_description: Research on long-running and multi-agent Claude Code sessions, and why the agentik tools exist.
site_author: agentik-dev
repo_url: https://github.com/agentik-dev/agentik-research
repo_name: agentik-dev/agentik-research
edit_uri: ""
# The footer's line, raw HTML in the theme's copyright partial: it also carries the
# one link from every page back to the suite's own page.
copyright: 'Part of <a href="https://agentik-dev.github.io/">the agentik suite</a>. The agentik-dev contributors. MIT licence; see the repository''s LICENSE.'

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/agentik.svg
  favicon: assets/images/favicon.svg
  # Inter is self-hosted in assets/glass/fonts/ (the skin's @font-face); no font request leaves the site.
  font: false
  icon:
    repo: material/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips
    - content.footnote.tooltips
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

# The glass layers, in this order: the vendored kit, the agentik skin (tokens
# only), then the site's own components. Never edit the vendored files.
extra_css:
  - assets/glass/glass.css
  - assets/glass/skins/agentik.css
  - assets/stylesheets/agentik-site.css

extra_javascript:
  - assets/glass/glass-browse.js
  - assets/glass/glass-cards.js
  - assets/javascripts/agentik.js

extra:
  generator: false
  social:
    - icon: material/github
      link: https://github.com/agentik-dev
      name: agentik-dev on GitHub
    - icon: material/rss
      link: https://agentik-dev.github.io/agentik-research/feed_rss_created.xml
      name: The journal's RSS feed

plugins:
  - search
  # The journal: dated entries under docs/journal/posts/, never in the nav.
  - blog:
      blog_dir: journal
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_readtime: true
      post_excerpt: required
      categories_allowed: [Worked, Did not work, Open]
      categories_url_format: "category/{slug}"
      archive_url_format: "archive/{date}"
      archive_date_format: yyyy
      pagination_per_page: 10
  # The journal's feed: feed_rss_created.xml and feed_rss_updated.xml at the site root.
  - rss:
      match_path: "journal/posts/.*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      categories:
        - categories
      feed_title: "Long-running Claude Code: the journal"
      feed_description: "Dated entries on long-running Claude Code work: what worked, what did not, and what is open."
  - social:
      cards_layout_dir: overrides/layouts
      cards_layout: agentik

# Notes in reading order, also inside `<div markdown>` blocks, with adjacent
# marks sorted and a comma between them; and a permalink for each glossary
# term (see each file).
hooks:
  - overrides/hooks/footnote_order.py
  - overrides/hooks/term_links.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  # Number notes in the order the text cites them, not the order they are
  # defined under "## Sources" (Python-Markdown 3.9 and later).
  - footnotes:
      USE_DEFINITION_ORDER: false
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [abbreviations.md]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Each page in docs/ is listed here; scripts/check holds the two in step.
nav:
  - Home:
      - index.md
      - summary.md
  - The field:
      - field/index.md
      - field/length-and-compaction.md
      - field/memory.md
      - field/budgets-and-lanes.md
      - field/many-agents.md
      - field/unattended-and-guardrails.md
      - field/review.md
      - field/telling-people.md
  - The tools:
      - tools/index.md
      - tools/session.md
      - tools/relay.md
      - tools/decisions.md
      - tools/respeak.md
      - tools/agents.md
  - Practices: practices.md
  - Journal:
      - journal/index.md
  - Reference:
      - method.md
      - glossary.md
      - sources.md
