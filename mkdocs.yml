site_name: Long-running Claude Code
site_description: Research on long-running and multi-agent Claude Code sessions, and why the agentik tools exist.
site_author: agentik-dev
repo_url: https://github.com/agentik-dev/agentik-research
repo_name: agentik-dev/agentik-research
edit_uri: ""
copyright: The agentik-dev contributors. See the repository's LICENSE.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.footnote.tooltips
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Each page in docs/ is listed here; scripts/check holds the two in step.
nav:
  - index.md
  - The field:
      - field/length-and-compaction.md
      - field/memory.md
      - field/budgets-and-lanes.md
      - field/many-agents.md
